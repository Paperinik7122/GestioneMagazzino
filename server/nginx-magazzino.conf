# Da aggiungere DENTRO il blocco "server { ... }" di NGINX che già serve Home Assistant su HTTPS
# (quello con il certificato Let's Encrypt). Non toccare il resto: Home Assistant continua a funzionare uguale.
# Dopo: sudo nginx -t && sudo systemctl reload nginx
# L'app sarà su  https://IL-TUO-HOSTNAME:8444/magazzino/

location = /magazzino {
    absolute_redirect off;
    return 301 /magazzino/;
}

location /magazzino/ {
    proxy_pass http://127.0.0.1:8090/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;        # il servizio lo usa per contare i codici sbagliati per indirizzo
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 40m;                       # il database viene inviato intero (compresso: pochi MB)
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
